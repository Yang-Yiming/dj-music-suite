[package]
name = "dj-music-core"
version.workspace = true
edition.workspace = true

[dependencies]
ncm_core = "0.2"
id3 = "1"
serde_json = "1"
sha2 = "0.10"
walkdir = "2.5.0"
lofty = "0.25.1"
serde = { version = "1.0.229", features = ["derive"] }
