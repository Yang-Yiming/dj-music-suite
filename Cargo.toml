[package]
name = "dj-music-suite"
version = "0.1.0"
edition = "2021"

[dependencies]
ncm_core = "0.2"
id3 = "1"
serde_json = "1"
sha2 = "0.10"
clap = { version = "4.6.6", features = ["derive"] }
indicatif = "0.18.6"
walkdir = "2.5.0"
lofty = "0.25.1"
serde = { version = "1.0.229", features = ["derive"] }

[profile.release]
strip = true
